# Alembic (өгөгдлийн сангийн migration)-ийн тохиргоо.
# Өгөгдлийн сангийн хаяг энд байхгүй: migrations/env.py нь апп-ийн тохиргооноос (DATABASE_URL) авдаг.

[alembic]
# Migration скриптүүдийн фолдер (энэ файлтай харьцангуй).
script_location = %(here)s/migrations
# Migration файлын нэр: огноо_цаг-ревизи_нэр
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Энэ фолдерыг sys.path-д нэмнэ, ингэснээр `angel` багцыг импортлож чадна.
prepend_sys_path = .
path_separator = os

# Шинэ migration үүсмэгц ruff-ээр засаж, форматлана.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Логийн тохиргоо (migrations/env.py ашиглана).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
