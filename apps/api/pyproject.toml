[project]
name = "angel"
version = "0.1.0"
description = "Angel API: image-based similar clothing search and e-commerce backend"
authors = [
    { name = "Iluminimal", email = "iluminimal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "phonenumbers>=9.0.41",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=5",
    "safetensors>=0.8.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# macOS PyPI-ийн анхдагч wheel-ийг (Apple MPS) авна; Linux (CI, Docker) нь хэдэн GB-ийн CUDA хувилбарын оронд
# зөвхөн CPU-ийн wheel авна.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-tqdm>=4.70.0.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "../../scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "C4", "PT", "RUF"]
# S101: тестэд assert зөвшөөрнө; ажиллах үеийн шалгалтад ашиглахгүй.
# RUF001-003: Монгол (Кирилл) тайлбарыг Латинтай төстэй тэмдэгт гэж буруу тооцдог.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations", "../../scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs the dev Postgres and Redis (make infra)",
    "model: downloads/loads the real FashionCLIP model (make test-ml), not run by default",
]
addopts = "-ra --strict-markers -m 'not model'"
